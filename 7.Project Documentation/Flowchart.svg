<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#222"/></marker><style>.box{fill:#f7f7f7;stroke:#222;stroke-width:2}.decision{fill:#fff;stroke:#222;stroke-width:2}.txt{font-family:Arial,sans-serif;font-size:20px;fill:#111;text-anchor:middle}.line{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
